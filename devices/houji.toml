[device]
codename = "houji"
brand = "Xiaomi"
model = "Xiaomi 14"
ab = true
soc = { hans = "第三代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 3 行動平台", en = "Snapdragon® 8 Gen 3 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# persist.sys.miui_resolution in the odm partition's build.prop, which is
# the n3 panel's own mode in the device tree.
width = 1200
height = 2670
density = 480

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Synaptics TouchComm over SPI behind Xiaomi's touch
# layer, the one touch driver the phone's own modules.load lists.
load = ["synaptics_tcm2"]

# As on the 17 Ultra, no init script of the phone's starts touch_report:
# the touch feature service turns the controller's raw frames into
# touches with /odm/lib64/libtouchreport.so, and a recovery runs none of
# it. Told through Xiaomi's touch layer, the driver has the controller
# report positions itself; that is known of the 17 Ultra's Synaptics
# controller and not yet tried on this phone's.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The key service and the credential service are built against the
# installed system's libhardware and libvndksupport, which a recovery's own
# library folder does not carry. They are taken from the system mounted at
# /mnt/system, with the loader the installed system's programs ask for, and
# the loader is told to search the folders the services name.
[[service]]
path = "/system/bin/sh"
args = ["-c", "mkdir -p /kmlibs; cp /mnt/system/system/lib64/libhardware.so /mnt/system/system/lib64/libvndksupport.so /mnt/system/system/lib64/libnetutils.so /kmlibs/ 2>/dev/null; cp /mnt/system/system/lib64/libnl.so /kmlibs/ 2>/dev/null; cp /mnt/system/system/lib64/bootstrap/libdl_android.so /kmlibs/ 2>/dev/null; cp /mnt/system/system/lib64/libdl_android.so /kmlibs/ 2>/dev/null; printf '[recovery]\nnamespace.default.isolated = false\n' > /kmlibs/ld.config.txt; chmod 755 /kmlibs; chmod 644 /kmlibs/*; exit 0"]
oneshot = true
user = "root"
groups = ["root"]

# The credential service refuses everything while it looks for the secure
# processing unit a recovery does not carry; the phone's own init turns
# that search off before starting it. This runs before the programs the
# installed system names for the keys.
[[service]]
path = "/system/bin/sh"
args = ["-c", "setprop vendor.gatekeeper.disable_spu true; setprop vendor.gatekeeper.is_security_level_spu 0; exit 0"]
oneshot = true
user = "root"
groups = ["root"]

# The secure world reaches back into Android through the listeners this
# daemon registers; the key service waits for them before it can use a key.
# Its socket is the one the phone's own init makes for it, which a recovery
# has no init to make.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw"]
sockets = [{ name = "notify-topology", user = "system", group = "drmrpc" }]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# The secure service gateway: the secure world calls back into the server
# it registers for system services.
[[service]]
path = "/vendor/bin/ssgtzd"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw"]
sockets = [
    { name = "ssgtzd", user = "system", group = "oem_2912" },
    { name = "ssgtzd_opener", user = "system", group = "system" },
]
user = "root"
groups = ["root"]
capabilities = ["WAKE_ALARM", "BLOCK_SUSPEND"]

# The key service, the only thing that can use the keys the phone wrapped
# in hardware. All four names it registers have to be described, or the
# service directory refuses it. It runs on the installed system's
# libhardware, so that the libraries it loads match the vendor partition's.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/kmlibs", "/system/lib64", "/vendor/lib64", "/vendor/lib64/hw"]
environment = { LD_CONFIG_FILE = "/kmlibs/ld.config.txt" }
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

# The credential service: the secure world has it check a screen lock, and
# it is the only thing that can hand out the note the key service wants
# before using a key a screen lock guards. This phone describes it in the
# manifest of its own SoC rather than among the fragments, so that file is
# given to the service directory as well.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-service-qti"
libraries = ["/kmlibs", "/system/lib64", "/vendor/lib64", "/vendor/lib64/hw"]
environment = { LD_CONFIG_FILE = "/kmlibs/ld.config.txt" }
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
description = "/vendor/etc/vintf/manifest_pineapple.xml"
user = "system"
groups = ["system"]

# The boot control, which says which slot the bootloader starts next and
# switches it. It comes last: the phone is usable without it.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot-service.qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.boot.IBootControl/default"
user = "root"
groups = ["root"]

# The phone's own recovery mounts the modem partition at
# /vendor/firmware_mnt and shows its image folder at /vendor/firmware, and
# its own table mounts persist at /mnt/vendor/persist. Skyward mounts the
# vendor partition over /vendor, which covers both: the modem's firmware
# is then out of the kernel's reach, and so are the secure world's applets
# and the files it keeps in persist. Both are mounted again where the
# phone's table puts them before any of its programs starts; the modem is
# shown at /firmware as well, the folder the recovery's own ueventd looks
# in for a driver's firmware.
[firmware]
partition = "modem"

[partitions]
mounted = ["persist"]

# WLAN: the kiwi node in the device tree, driven by qca_cld3_kiwi_v2, the
# one WLAN driver the phone's own modules.blocklist leaves of those its
# modules.load lists. Its cfg80211 asks for rfkill, one of the kernel's own
# modules in system_dlkm, as the 17 Ultra's does. Its recovery covers the
# vendor partition's firmware folder with the modem's, as the 13 Ultra's
# does, so the settings and the MAC address are given to the loader again:
# the settings from the vendor partition, the address from where the
# vendor's link points in persist. wpa_supplicant runs on the recovery's
# own libraries before the vendor partition's, as on the 17 Ultra.
[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", path = "/mnt/vendor/persist/kiwi_v2/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS3.0.307.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of.
[stock]
version = "OS3.0.307.0.WNCCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.307.0.WNCCNXM/houji-ota_full-OS3.0.307.0.WNCCNXM-user-16.0-8f4e9f2429.zip"
recovery = "8a3362596aca1b340c7823a9b6667696b5e7cda3fbe32f910b868d16bcd90212"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), whose driver says the
# motor's resonant frequency as the 17 Ultra's does; the click is made from
# samples at that frequency, and the strengths are the 17 Ultra's. Neither
# is yet tried on this phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }
